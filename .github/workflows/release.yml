name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build release binaries
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          bash scripts/build-release.sh $VERSION

      - name: Generate SHA256 checksums
        run: |
          cd dist
          for file in *.tar.gz; do
            sha256sum "$file" > "$file.sha256"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-formula:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get release info
        id: release_info
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          
          # Download SHA256 files and extract checksums
          for platform in "Darwin_x86_64" "Darwin_arm64" "Linux_x86_64"; do
            CHECKSUM=$(gh api repos/${{ github.repository }}/releases/tags/$VERSION \
              | jq -r ".assets[] | select(.name | contains(\"$platform\")) | .name" \
              | head -1)
            if [ ! -z "$CHECKSUM" ]; then
              SHA=$(gh api repos/${{ github.repository }}/releases/tags/$VERSION \
                | jq -r ".assets[] | select(.name == \"${CHECKSUM}.sha256\") | .name" \
                | xargs -I {} gh api repos/${{ github.repository }}/releases/assets/{} -q '.body' | cut -d' ' -f1)
              echo "${platform}_sha=${SHA}" >> $GITHUB_OUTPUT
            fi
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update formula SHA256
        run: |
          VERSION=${{ steps.release_info.outputs.version }}
          cd Formula
          
          # Update version
          sed -i "s/version \".*\"/version \"${VERSION}\"/" tuipr.rb
          
          # Note: SHA256 placeholders need manual update or goreleaser
          echo "Formula version updated to ${VERSION}"
          echo "Note: SHA256 checksums need to be updated manually or via goreleaser"
